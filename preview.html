<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile README Preview - @mrparasssingh</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    .readme-card {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 32px;
      max-width: 920px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h3 {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      color: #7ee787;
      margin: 20px 0 12px;
      text-align: left;
      padding-left: 10px;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
    }
    td {
      padding: 6px;
      vertical-align: top;
    }
    img {
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="readme-card">
    <h3><code>paras@github ~ $ ./contributions.sh</code></h3>
    <img src="./contrib-heatmap.svg" width="860" alt="Contribution Heatmap" />

    <br><br>

    <table>

        <td valign="top"><img src="./avi-ascii.svg" width="370" alt="ASCII Portrait" /></td>
